name: Clear in-review on closed issues

# `in-review` marks an issue whose PR is up and awaiting a human merge. Merging
# that PR closes the issue via `Closes #N` but leaves the label behind, so it
# accumulates on closed issues. Sweep closed issues once a day instead of
# running per close: each per-close run billed a full minute (261 in August).

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Strip in-review from closed issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue list --state closed --label in-review --limit 200 --json number -q '.[].number' |
            xargs -r -n1 -I{} gh issue edit {} --remove-label in-review
