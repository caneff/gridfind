[project]
name = "gridfind"
version = "0.1.0"
description = "Grid-puzzle constraint solving and validation: found/broke/unknown via CP-SAT."
readme = "README.md"
authors = [
    { name = "t", email = "t@t" }
]
requires-python = ">=3.14"
dependencies = [
    "lzstring>=1.0.4",
    "ortools>=9.15.6755",
]

[project.scripts]
gridfind = "gridfind.cli:console_main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.165.1",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
    "ty>=0.0.66",
]

# --- ruff (lint + format) ---
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
  "E", "F", "I", "B", "UP",
  "SIM", "RUF",
  "C4", "PIE", "PERF",
  "PT", "A", "PTH",
  "S", "N", "ANN", "RET", "ISC",
]
ignore = [
  "N803", "N806",
]

[tool.ruff.lint.per-file-ignores]
"*_test.py" = ["S101"]
"conftest.py" = ["S101"]

# --- ty (type check) ---
[tool.ty.environment]
python-version = "3.14"
root = ["./src", "./scripts"]

[tool.ty.terminal]
error-on-warning = true

[[tool.ty.overrides]]
include = ["**/*_test.py"]

[tool.ty.overrides.rules]
deprecated = "ignore"

# --- pytest (hardened) ---
[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config -m \"not e2e and not slow\""
xfail_strict = true
markers = [
  "e2e: exercises a real SudokuMaker link end to end — through the CLI front door, or the library path (`enumerate_witnesses`) direct (slow CP-SAT solves); deselected by default, run via `just e2e`.",
  "slow: a library test whose CP-SAT solve is too slow for the default gate (e.g. an exhaustive enumeration); deselected by default, run via `just slow`.",
]

# --- coverage (soft) ---
[tool.coverage.run]
branch = true

# --- mutmut (mutation testing; run via the mutation-audit skill, not `just check`).
# `scripts/eval_links.py`'s render+server half (presentation, not logic) is
# excluded inline via `# pragma: no mutate start/end` — its data layer above
# that marker stays in scope here.
[tool.mutmut]
source_paths = ["src/gridfind", "scripts"]
runner = "uv run pytest -x"

# --- wheel: don't ship interleaved test files, fixtures, or test-only support ---
# witness_validator is imported only by the e2e tests (an independent oracle for
# the CLI's rendered witness); it's not public API, so keep it off the shipped
# py.typed surface.
[tool.uv.build-backend]
source-exclude = ["**/*_test.py", "**/conftest.py", "**/witness_validator.py"]
